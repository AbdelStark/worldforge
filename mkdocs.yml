site_name: WorldForge
site_description: Testable world-model workflows for physical-AI systems.
site_url: https://abdelstark.github.io/worldforge/
repo_url: https://github.com/AbdelStark/worldforge
repo_name: AbdelStark/worldforge

docs_dir: docs/src
site_dir: site
strict: true
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: WorldForge 中文文档
          site_description: 面向物理 AI 系统的可测试世界模型工作流。
          nav_translations:
            Home: 首页
            Introduction: 简介
            Documentation Map: 文档导航
            Getting Started: 快速上手
            Quick Start: 快速开始
            CLI Reference: CLI 参考
            Examples And CLI Commands: 示例与 CLI 命令
            Showcases: 案例展示
            Demo Showcase Workflows: 演示案例工作流
            Use Case Cookbook: 用例手册
            Robotics Replay Showcase: 机器人回放案例
            Robotics Showcase Deep Dive: 机器人案例深入解析
            Rerun Integration: Rerun 集成
            System Model: 系统模型
            World Model Taxonomy: 世界模型分类法
            Architecture: 架构
            Control And Planning: 控制与规划
            Decisions: 决策记录
            Persistence Adapter Boundary: 持久化适配器边界
            Providers: 提供方
            Overview: 概览
            Provider Configuration Index: 提供方配置索引
            Provider Failure Mode Gallery: 提供方故障模式图鉴
            Authoring And API: 编写与 API
            Provider Authoring Guide: 提供方编写指南
            External Provider Packages: 外部提供方包
            Adoption Case Studies: 采用案例研究
            Adoption Case Study Template: 采用案例研究模板
            Scenario Definition Format: 场景定义格式
            Provider Routing And Fallback: 提供方路由与回退
            Python API: Python API
            Public API Stability: 公共 API 稳定性
            Capability Fixture Corpus: 能力夹具语料库
            Capability Negotiation: 能力协商
            Capability Protocols Quickstart: 能力协议快速上手
            Evidence And Evaluation: 证据与评估
            Evaluation: 评估
            Benchmarking: 基准测试
            Live Smoke Evidence Registry: 在线冒烟证据登记
            Claim-To-Evidence Map: 主张到证据映射
            Artifact Schemas: 工件结构定义
            Artifact Integrity: 工件完整性
            Operations And Quality: 运维与质量
            User And Operator Playbooks: 用户与运维手册
            Run Artifact Index: 运行工件索引
            Static HTML Reports: 静态 HTML 报告
            World State Diff And Patch: 世界状态差异与补丁
            Engineering Quality: 工程质量
            Operations: 运维
            Security: 安全
            Support: 支持
            Contributing: 贡献指南
            Contributor Task Starters: 贡献者任务起步
            Planning Records: 规划记录
            Roadmap: 路线图
            Roadmap Expansion 3: 路线图扩展 3
            Roadmap Expansion 2: 路线图扩展 2
            Roadmap Expansion: 路线图扩展
            Roadmap Continuation: 路线图延续
            Provider And Platform Roadmap: 提供方与平台路线图
            Next Provider Selection RFC: 下一个提供方选型 RFC
            Provider Cohort Selection Record: 提供方批次选型记录
            Project Metadata: 项目元信息
            Changelog: 更新日志
            Citation: 引用

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Documentation Map: docs-map.md
  - Getting Started:
      - Quick Start: quickstart.md
      - CLI Reference: cli.md
      - Examples And CLI Commands: examples.md
  - Showcases:
      - Demo Showcase Workflows: demo-showcases.md
      - Use Case Cookbook: use-case-cookbook.md
      - Robotics Replay Showcase: robotics-showcase.md
      - Robotics Showcase Deep Dive: robotics-showcase-deep-dive.md
      - Rerun Integration: rerun.md
  - System Model:
      - World Model Taxonomy: world-model-taxonomy.md
      - Architecture: architecture.md
      - Control And Planning: control-planning.md
  - Decisions:
      - Persistence Adapter Boundary: adr/0001-persistence-adapter-boundary.md
  - Providers:
      - Overview: providers/README.md
      - Provider Configuration Index: provider-configuration-index.md
      - Provider Failure Mode Gallery: provider-failure-gallery.md
      - Cosmos-Policy: providers/cosmos-policy.md
      - Genie: providers/genie.md
      - GR00T: providers/gr00t.md
      - JEPA: providers/jepa.md
      - JEPA-WMS: providers/jepa-wms.md
      - LeWorldModel: providers/leworldmodel.md
      - LeRobot: providers/lerobot.md
  - Authoring And API:
      - Provider Authoring Guide: provider-authoring-guide.md
      - External Provider Packages: external-providers.md
      - Adoption Case Studies: adoption-case-studies/README.md
      - Adoption Case Study Template: adoption-case-studies/_template.md
      - Scenario Definition Format: scenarios.md
      - Provider Routing And Fallback: provider-routing.md
      - Python API: api/python.md
      - Public API Stability: api-stability.md
      - Capability Fixture Corpus: fixtures.md
      - Capability Negotiation: capability-negotiation.md
      - Capability Protocols Quickstart: capability-protocols-quickstart.md
  - Evidence And Evaluation:
      - Evaluation: evaluation.md
      - Benchmarking: benchmarking.md
      - Live Smoke Evidence Registry: live-smoke-evidence.md
      - Claim-To-Evidence Map: claim-evidence-map.md
      - Artifact Schemas: artifact-schemas.md
      - Artifact Integrity: artifact-integrity.md
  - Operations And Quality:
      - User And Operator Playbooks: playbooks.md
      - Run Artifact Index: run-index.md
      - Static HTML Reports: html-reports.md
      - World State Diff And Patch: world-diff.md
      - Engineering Quality: quality.md
      - Operations: operations.md
      - Security: security.md
      - Support: support.md
      - Contributing: contributing.md
      - Contributor Task Starters: task-starters.md
  - Planning Records:
      - Roadmap: roadmap.md
      - Roadmap Expansion 3: roadmap-expansion-3.md
      - Roadmap Expansion 2: roadmap-expansion-2.md
      - Roadmap Expansion: roadmap-expansion.md
      - Roadmap Continuation: roadmap-continuation.md
      - Provider And Platform Roadmap: provider-platform-roadmap.md
      - Next Provider Selection RFC: provider-selection-rfc.md
      - Provider Cohort Selection Record: provider-cohort-selection.md
  - Project Metadata:
      - Changelog: changelog.md
      - Citation: citation.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
